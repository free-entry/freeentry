# Monthly watchdog: fails (and so notifies) once any verified fact is older
# than the 365-day re-verification interval, or an event year is missing.
# Quiet the rest of the year by design.
name: Data freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check data freshness
        run: bun run check:freshness
